name: TraceCart CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Generate scenario test feeds
        run: |
          python -m tracecart.feeds.generate

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: Verify CLI end-to-end
        run: |
          python -m tracecart.run --scenario S01 --mode cache --out runs/ci-test --print --eval --baseline

      - name: Check generated artifacts
        run: |
          test -f runs/ci-test/decisions.jsonl
          test -f runs/ci-test/metrics.json
          test -f runs/ci-test/comparison.json
          test -f runs/ci-test/config_snapshot.yaml
