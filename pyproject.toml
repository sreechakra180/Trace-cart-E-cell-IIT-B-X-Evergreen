[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecart"
version = "0.1.0"
description = "Mobile Scan & Go reconciliation engine: zone-conditioned event schema, gated min-cost association, evidence-quality gating, 3-state decision policy"
authors = [
    {name = "TraceCart Team", email = "tracecart@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["retail", "computer vision", "reconciliation", "scan-and-go", "loss prevention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "opencv-python-headless>=4.10,<5.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn>=0.28.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27.0,<1.0",
    "tabulate>=0.9.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/Team-Samanvaya/tracecart"
Documentation = "https://github.com/Team-Samanvaya/tracecart#readme"
Repository = "https://github.com/Team-Samanvaya/tracecart"

[project.optional-dependencies]
vision = [
    "ultralytics>=8.0,<9.0",
    "lapx>=1.0,<2.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.1.0",
]

[project.scripts]
tracecart = "tracecart.run:main"
tracecart-feeds = "tracecart.feeds.generate:generate_demo_feeds"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracecart*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"