[tool.poetry]
name = "tracecart"
version = "0.1.0"
description = "Mobile Scan & Go reconciliation engine: zone-conditioned event schema, gated min-cost association, evidence-quality gating, 3-state decision policy"
authors = ["TraceCart Team"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.26"
scipy = "^1.12"
pydantic = "^2.7"
pyyaml = "^6.0"
pytest = "^8.3"
opencv-python-headless = "^4.10"

[tool.poetry.group.dev.dependencies]
ultralytics = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]