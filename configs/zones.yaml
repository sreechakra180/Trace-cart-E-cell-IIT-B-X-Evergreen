# Zone definitions in pixel coordinates (e.g. 960x540 resolution)
# Z_PICK is the shelf pick zone; Z_BAG is the bagging/cart area.
zones:
  Z_PICK:
    polygon:
      - [100.0, 100.0]
      - [450.0, 100.0]
      - [450.0, 380.0]
      - [100.0, 380.0]
    store_zone: "aisle04"
  Z_BAG:
    polygon:
      - [500.0, 260.0]
      - [880.0, 260.0]
      - [880.0, 500.0]
      - [500.0, 500.0]
    store_zone: "aisle04"
