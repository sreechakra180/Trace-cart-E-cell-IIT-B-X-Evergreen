# TraceCart Ruff Linter & Formatter Configuration
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by black/formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[lint.per-file-ignores]
"tests/*" = ["B", "E", "F"]

[format]
quote-style = "double"
indent-style = "space"
